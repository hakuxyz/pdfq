[package]
name = "pdfq"
version = "0.1.1"
edition = "2024"
description = "Fast, parallel PDF search with a pdfgrep-compatible CLI"
license = "MIT"
repository = "https://github.com/hakuxyz/pdfq"
readme = "README.md"
exclude = ["PROMO.md"]
keywords = ["pdf", "search", "grep", "cli"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.88"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.20.0"
globset = "0.4.21"
lopdf = "0.42"
pdf-extract = "0.12.1"
rayon = "1.12.0"
regex = "1.13.1"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
